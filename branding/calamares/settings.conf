# TermOS Calamares settings. Installed to /etc/calamares/settings.conf.
#
# Based on Fedora's own Calamares setup (/usr/share/calamares/settings.conf):
# the same install steps, with TermOS branding. Modules without a config in
# /etc/calamares/modules use Fedora's from /usr/share/calamares/modules.
---
modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs          # copies the live image (/run/rootfsbase) to disk
  - machineid
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - dracutlukscfg
  - fstab
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - dracut            # rebuilds the initramfs (with the TermOS boot splash)
  - grubcfg
  - bootloader
  - packages          # removes live-only packages, see modules/packages.conf
  - umount
- show:
  - finished

branding: termos

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
