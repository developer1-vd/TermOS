# TermOS welcome page: requirements checks (Fedora's config enables some
# test-only checks, so TermOS uses its own list).
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    requiredStorage:    25
    requiredRam:        2.0
    internetCheckUrl:   https://fedoraproject.org/static/hotspot.txt
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - storage
        - ram
        - root

geoip:
    style:    "json"
    url:      "https://geoip.fedoraproject.org/city"
    selector: "country_code"
