# TermOS disk partitioning, based on Fedora's Calamares partition.conf.
#
# The one change: no defaultPartitionTableType. Fedora sets it to "gpt",
# which breaks installs on BIOS (legacy) machines: GRUB for BIOS can't be
# installed on a GPT disk without a BIOS boot partition, which Calamares'
# automatic layout doesn't create, so grub2-install --target=i386-pc fails.
# Left unset, Calamares uses GPT on UEFI machines and MBR (msdos) on BIOS.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

userSwapChoices:
    - none      # Create no swap, use no swap
    - small     # Up to 4GB
    - suspend   # At least main memory size
    - file      # To swap file instead of partition

luksGeneration: luks1

drawNestedPartitions:   true
alwaysShowPartitionLabels: true

initialPartitioningChoice: none
initialSwapChoice: none

defaultFileSystemType:  "btrfs"

essentialMounts: [ "live-*", "control", "ventoy" ]

lvm:
    enable: true
