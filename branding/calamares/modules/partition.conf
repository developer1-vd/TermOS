# TermOS disk partitioning, based on Fedora's Calamares partition.conf.
#
# Two changes from Fedora's:
#
# 1. No defaultPartitionTableType. Fedora sets it to "gpt", which breaks
#    installs on BIOS (legacy) machines: GRUB for BIOS can't be installed on
#    a GPT disk without a BIOS boot partition, which Calamares' automatic
#    layout doesn't create, so grub2-install --target=i386-pc fails. Left
#    unset, Calamares uses GPT on UEFI machines and MBR (msdos) on BIOS.
#
# 2. A partitionLayout with a separate ext4 /boot, like Fedora's own
#    installer makes. Without it, /boot is a btrfs subvolume (/@boot, from
#    mount.conf), and GRUB looks for /boot/vmlinuz-* from the top of the
#    btrfs filesystem, doesn't find the kernel, and the system can't boot.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

userSwapChoices:
    - none      # Create no swap, use no swap
    - small     # Up to 4GB
    - suspend   # At least main memory size
    - file      # To swap file instead of partition

luksGeneration: luks1

drawNestedPartitions:   true
alwaysShowPartitionLabels: true

initialPartitioningChoice: none
initialSwapChoice: none

defaultFileSystemType:  "btrfs"

# Layout for "Erase disk". On UEFI machines Calamares adds the EFI system
# partition (see efi: above) by itself. "unknown" means the default file
# system above, or the one the user picks. /boot is never encrypted, so
# GRUB can always read the kernel.
partitionLayout:
    - name: "boot"
      filesystem: "ext4"
      noEncrypt: true
      mountPoint: "/boot"
      size: 1G
    - name: "root"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%

essentialMounts: [ "live-*", "control", "ventoy" ]

lvm:
    enable: true
