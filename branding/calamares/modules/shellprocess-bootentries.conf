# Runs inside the new system after the bootloader step: makes the boot menu
# entries' kernel paths match a separate /boot partition (see
# /usr/libexec/termos/termos-fix-boot-entries).
---
dontChroot: false
timeout: 60
verbose: true
script:
    - "/usr/libexec/termos/termos-fix-boot-entries"
i18n:
    name: "Setting up boot menu entries"
