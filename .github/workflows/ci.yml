name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck and pykickstart
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pipx install pykickstart
      - name: Lint
        run: make lint

  # Every desktop termos-desktop offers must be a real Fedora group that
  # installs cleanly (dnf only works out the transactions).
  desktops:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check the desktops against Fedora
        run: |
          # The Fedora release TermOS builds on (the default in build-iso.sh).
          # shellcheck disable=SC2016
          release="$(sed -n 's/^release="${TERMOS_RELEASE:-\([0-9]*\)}"$/\1/p' iso/build-iso.sh)"
          docker run --rm -v "$PWD:/src:ro" "registry.fedoraproject.org/fedora:${release:-45}" \
            /src/tests/desktop-test.sh

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build flake
        run: nix build .#termos
      - name: Termite mode smoke test
        run: |
          printf 'One.\nTwo.\nThree.\n' | ./result/bin/termos-fetch | grep -q 'Kernel: Three.'
      - name: Version and easter egg smoke test
        run: |
          ./result/bin/termos-fetch --version < /dev/null | grep -qx "TermOS $(cat VERSION)"
          ./result/bin/termos-run teapot | grep -q "418"
          ./result/bin/termos-desktop | grep -q "xfce"
