name: Build ISO

# Manual only: a full ISO build is large and slow (about an hour).
on:
  workflow_dispatch:
    inputs:
      release:
        description: Fedora release to base on
        default: "45"
      publish:
        description: Publish the ISO to the GitHub release for this version (tag v<VERSION>)
        type: boolean
        default: false
      test_run:
        description: Only test the ISO an earlier run built (that run's ID); skips building and publishing
        default: ""

permissions:
  contents: write   # only used to create the release and upload the ISO
  actions: read     # to download an earlier run's ISO (test_run)

jobs:
  iso:
    if: ${{ inputs.test_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: TermOS-${{ steps.version.outputs.version }}-fedora${{ inputs.release }}-x86_64
    steps:
      - uses: actions/checkout@v5

      - name: Read the TermOS version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h / /mnt

      # Docker runs the Fedora build container as root, which loop devices
      # need. The build's scratch space goes on /mnt, the runner's bigger disk.
      - name: Build ISO in a Fedora container
        env:
          TERMOS_RELEASE: ${{ inputs.release }}
          TERMOS_ENGINE: docker
          TERMOS_WORKDIR: /mnt/termos-build
        run: |
          sudo mkdir -p "$TERMOS_WORKDIR"
          iso/build-iso.sh --container
          ls -l build/out

      # GitHub release files must be under 2 GiB, so a bigger ISO is split
      # into parts that are joined again with cat.
      - name: Prepare release files
        id: files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          iso="TermOS-$VERSION-x86_64.iso"
          cp "build/out/$iso" "$dir/"
          cd "$dir"
          sha256sum "$iso" > SHA256SUMS
          if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
            split -b 1900M -d -a 1 "$iso" "$iso.part"
            rm "$iso"
            sha256sum "$iso".part* >> SHA256SUMS
          fi
          ls -l
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TermOS-${{ steps.version.outputs.version }}-fedora${{ inputs.release }}-x86_64
          path: ${{ steps.files.outputs.dir }}/*
          compression-level: 0

  # Install the ISO's system with Anaconda (the real installer, unattended
  # from a kickstart) onto a virtual disk, then boot it. Only a passing ISO
  # gets published.
  install-test:
    needs: iso
    # Runs after a successful build, or on its own with test_run.
    if: ${{ always() && (needs.iso.result == 'success' || inputs.test_run != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Read the TermOS version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: TermOS-${{ steps.version.outputs.version }}-fedora${{ inputs.release }}-x86_64
          path: iso-files
          run-id: ${{ inputs.test_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Join the ISO and take out its root filesystem
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo mkdir -p /mnt/test /mnt/iso
          sudo chown "$USER" /mnt/test
          iso="TermOS-$VERSION-x86_64.iso"
          cd iso-files
          if ls "$iso".part* >/dev/null 2>&1; then
            cat "$iso".part* > "/mnt/test/$iso"
          else
            mv "$iso" "/mnt/test/$iso"
          fi
          cd /mnt/test
          sha256sum --check --ignore-missing "$GITHUB_WORKSPACE/iso-files/SHA256SUMS"
          sudo mount -o loop,ro "$iso" /mnt/iso
          cp /mnt/iso/LiveOS/squashfs.img /mnt/test/
          sudo umount /mnt/iso
          rm "$iso"
          df -h /mnt

      - name: Let the test use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install with Anaconda and boot the installed system
        env:
          FEDORA: ${{ inputs.release }}
        run: |
          docker run --rm --privileged -v /dev:/dev \
            -v "$GITHUB_WORKSPACE:/src:ro" -v /mnt/test:/work \
            "registry.fedoraproject.org/fedora:$FEDORA" bash -c '
              dnf install -y -q anaconda-tui qemu-system-x86-core util-linux rsync \
                e2fsprogs xfsprogs btrfs-progs dosfstools \
              && /src/tests/install-test.sh /work/squashfs.img /work/disk.img 1200'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-test-logs
          path: |
            /mnt/test/*.serial.log
            /mnt/test/anaconda-logs/
          if-no-files-found: ignore

  publish:
    needs: [iso, install-test]
    if: ${{ inputs.publish && inputs.test_run == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.iso.outputs.artifact }}
          path: release

      - name: Publish to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.iso.outputs.version }}
          FEDORA: ${{ inputs.release }}
        run: |
          tag="v$VERSION"
          iso="TermOS-$VERSION-x86_64.iso"
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "TermOS $VERSION, based on Fedora $FEDORA."
            echo
            # This version's section of CHANGELOG.md, without its heading.
            awk -v v="## v$VERSION" '$0 ~ "^"v {f=1; next} f && /^## / {exit} f' CHANGELOG.md
            echo
            echo "## Download"
            echo
            if ls release/"$iso".part* >/dev/null 2>&1; then
              echo "The ISO is split into parts (GitHub limits release files to 2 GiB)."
              echo "Download every \`$iso.part*\` file and \`SHA256SUMS\`, then join and check them:"
              echo
              echo '```bash'
              echo "cat $iso.part* > $iso"
              echo "sha256sum --check --ignore-missing SHA256SUMS"
              echo '```'
            else
              echo "Download \`$iso\` and \`SHA256SUMS\`, then check it:"
              echo
              echo '```bash'
              echo "sha256sum --check --ignore-missing SHA256SUMS"
              echo '```'
            fi
            echo
            echo "Write it to a USB stick with Fedora Media Writer, then boot from it and double-click **Install TermOS**."
          } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "TermOS $VERSION" --notes-file "$notes"
          fi
          gh release upload "$tag" --clobber release/*
