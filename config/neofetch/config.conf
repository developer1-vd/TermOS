# TermOS neofetch config: matrix logo.
# Install to ~/.config/neofetch/config.conf

print_info() {
    info title
    info underline

    prin "OS" "TermOS ($(. /etc/os-release && echo "$NAME $VERSION_ID"))"
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info "Disk" disk

    info cols
}

image_backend="ascii"
image_source="/usr/share/termos/logo-matrix.txt"
ascii_colors=(2)
colors=(2 2 2 2 2 7)
bold="on"
