# TermOS neofetch config: matrix logo.
# Install to ~/.config/neofetch/config.conf

print_info() {
    info title
    info underline

    # On TermOS, os-release already says "TermOS 0.1 (Fedora Linux 45)";
    # anywhere else, say TermOS around the host's name.
    prin "OS" "$(. /etc/os-release
        if [ "$NAME" = TermOS ]; then echo "$PRETTY_NAME"
        else echo "TermOS${TERMOS_VERSION:+ $TERMOS_VERSION} ($PRETTY_NAME)"; fi)"
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info "Disk" disk

    info cols
}

image_backend="ascii"
image_source="/usr/share/termos/logo-matrix.txt"
ascii_colors=(2)
colors=(2 2 2 2 2 7)
bold="on"
